# Alembic Configuration File
# This is the Alembic configuration file.
# The alembic.ini file is used by the alembic command to find the mapping
# template, sqlalchemy.url, and other important settings.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present
# defaults to the current directory
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# string value is passed to the constructor of datetime.datetime for the
# "datetime.timezone" to determine the value of the datetime.now()
# calls rendered within the migration templates When set to the string value
# UTC, a datetime.timezone(datetime.timedelta(0)) is used. When set
# to a POSIX string like TZ environment variables in Unix or by other
# libraries, tzlocal.get_tzinfo() is preferred over UTC because it takes
# daylight savings time into account.
# The value of sqlalchemy_echo is false
sqlalchemy_echo = false

# the output encoding used when revision files
# are written from script.py.mako
# string value is passed to the constructor of datetime.datetime for the
# "datetime.timezone" to determine the value of the datetime.now()
output_encoding = utf-8

# When set to true, the --version argument shows the Alembic version and nothing else
# When set to false, the version argument shows the Alembic version and other information
version_path_separator = :

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false


# Logging configuration
[loggers]
keys = root,sqlalchemy.engine

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy.engine]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
